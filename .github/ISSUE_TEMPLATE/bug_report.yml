name: バグ報告
description: 不具合を報告して改善に協力してください
title: '[Bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |-
        comment-overlayに関する内容を、目的と確認できた事実に分けて記載してください。
        Cookie、認証トークン、パスワード、個人情報を本文や添付に含めないでください。
        投稿前に[README](https://github.com/roflsunriz/comment-overlay/blob/master/README.md)と[既存Issue](https://github.com/roflsunriz/comment-overlay/issues)を確認してください。
        脆弱性の報告は[SECURITY.md](https://github.com/roflsunriz/comment-overlay/blob/master/SECURITY.md)の案内に従ってください。
  - type: checkboxes
    id: preflight
    attributes:
      label: 事前確認
      options:
        - label: 既存Issueを検索しました。
          required: false
        - label: 可能な範囲で最新の公開版でも確認しました。
          required: false
  - type: textarea
    id: legacy-1
    attributes:
      label: 概要
      description: 期待した動作と実際の動作を簡潔に記述してください
    validations:
      required: false
  - type: textarea
    id: environment-common
    attributes:
      label: 対象と環境
      description: 対象機能、使用中の版またはコミット、OSと実行環境を記載してください。
    validations:
      required: false
  - type: textarea
    id: legacy-2
    attributes:
      label: 再現手順
      description: |-
        1.
        2.
        3.
    validations:
      required: false
  - type: textarea
    id: legacy-3
    attributes:
      label: 期待した結果
      description: 本来どのように動作すべきかを記述してください
    validations:
      required: false
  - type: textarea
    id: actual-common
    attributes:
      label: 実際の結果
      description: 観測した症状とエラーメッセージを記載してください。
    validations:
      required: false
  - type: textarea
    id: diagnostics-common
    attributes:
      label: 診断情報
      description: 秘密情報を除いたログや画面を添付してください。
    validations:
      required: false
  - type: textarea
    id: legacy-4
    attributes:
      label: 補足
      description: |-
        - 実行環境: 例: Node.js 20.11.1 / Chrome 130
        - ログやスクリーンショットがあれば添付してください
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文と添付に秘密情報や個人情報が含まれていないことを確認しました。
          required: true
